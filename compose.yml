services:
  db:
    image: docker.io/library/postgres:17-alpine
    container_name: setic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: setic_qualidade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - setic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d setic_qualidade"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  setic_postgres_data:
